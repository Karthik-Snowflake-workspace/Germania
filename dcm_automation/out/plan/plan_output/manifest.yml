manifest_version: 2
type: DCM_PROJECT
default_target: DCM_METADATA
targets:
  DCM_METADATA:
    account_identifier: KIPI-KIPI_PRIMARY
    project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_DCM_PROJECT
    project_owner: PSEUDO_ACCOUNTADMIN
    templating_config: dcm_project
  GERMANIA_DCM_DEV:
    account_identifier: KIPI-KIPI_PRIMARY
    project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_DEV
    project_owner: PSEUDO_ACCOUNTADMIN
    templating_config: dev
  GERMANIA_DCM_PROD:
    account_identifier: KIPI-KIPI_PRIMARY
    project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_PROD
    project_owner: PSEUDO_ACCOUNTADMIN
    templating_config: prod
  GERMANIA_DCM_QA:
    account_identifier: KIPI-KIPI_PRIMARY
    project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_QA
    project_owner: PSEUDO_ACCOUNTADMIN
    templating_config: qa
  GERMANIA_DCM_UAT:
    account_identifier: KIPI-KIPI_PRIMARY
    project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_UAT
    project_owner: PSEUDO_ACCOUNTADMIN
    templating_config: uat
templating:
  defaults:
    project_owner_role: PSEUDO_ACCOUNTADMIN
    warehouse: github_cicd_demo_wh
  configurations:
    dcm_project:
      environment: dcm_project
      env_suffix: _dcm_project
      database: CICD_METADATA
      schemas:
      - DCM_CONFIG
      project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_DCM_PROJECT
      project_owner: PSEUDO_ACCOUNTADMIN
      roles:
        DBA_ADMIN: DBA_ADMIN
        DBA_FR: DBA_FR
      is_default_target: true
    dev:
      environment: dev
      env_suffix: _dev
      database: GERMANIA_DEVOPS_DB_DEV
      schemas:
      - CLAIMS
      - PAYERS
      project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_DEV
      project_owner: PSEUDO_ACCOUNTADMIN
      roles:
        DBA_ADMIN: DBA_ADMIN
        DBA_FR: DBA_FR
      is_default_target: false
    prod:
      environment: prod
      env_suffix: _prod
      database: GERMANIA_DEVOPS_DB_PROD
      schemas:
      - CLAIMS
      - PAYERS
      project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_PROD
      project_owner: PSEUDO_ACCOUNTADMIN
      roles:
        DBA_ADMIN: DBA_ADMIN
        DBA_FR: DBA_FR
      is_default_target: false
    qa:
      environment: qa
      env_suffix: _qa
      database: GERMANIA_DEVOPS_DB_QA
      schemas:
      - CLAIMS
      - PAYERS
      project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_QA
      project_owner: PSEUDO_ACCOUNTADMIN
      roles:
        DBA_ADMIN: DBA_ADMIN
        DBA_FR: DBA_FR
      is_default_target: false
    uat:
      environment: uat
      env_suffix: _uat
      database: GERMANIA_DEVOPS_DB_UAT
      schemas:
      - CLAIMS
      - PAYERS
      project_name: CICD_METADATA.DCM_CONFIG.DCM_AUTOMATION_UAT
      project_owner: PSEUDO_ACCOUNTADMIN
      roles:
        DBA_ADMIN: DBA_ADMIN
        DBA_FR: DBA_FR
      is_default_target: false
